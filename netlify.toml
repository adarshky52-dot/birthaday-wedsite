# Netlify Configuration File
[build]
  # Base directory for the build (Next.js frontend)
  base = "frontend"
  
  # Directory where the compiled static files are exported (frontend/out)
  publish = "out"
  
  # Build command inside the frontend directory
  command = "npm run build"

[build.environment]
  # Environment variables for build time
  STATIC_EXPORT = "true"
  NEXT_USE_NETLIFY_EDGE = "true"

# Caching headers for Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
